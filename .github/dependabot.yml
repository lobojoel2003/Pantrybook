version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      svelte:
        patterns:
          - 'svelte'
          - 'svelte-check'
          - '@sveltejs/*'
          - '*-plugin-svelte'
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(docker)'
