# Fly.io: https://fly.io/docs/reference/configuration/
#   fly launch --copy-config --no-deploy      # pick an app name and region
#   fly volumes create pantrybook_data --size 1
#   fly deploy
app = 'pantrybook'
primary_region = 'iad'

[build]
  image = 'ghcr.io/lobojoel2003/pantrybook:latest'

[env]
  PANTRYBOOK_DATA_DIR = '/data'
  PROTOCOL_HEADER = 'x-forwarded-proto'
  # Fly puts the visitor's IP here; used to throttle repeated failed sign-ins per device.
  ADDRESS_HEADER = 'fly-client-ip'

[[mounts]]
  source = 'pantrybook_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
